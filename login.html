<!DOCTYPE html>
<html>
<head>
    <title>Login Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-primary d-flex justify-content-center align-items-center vh-100">

<div class="card shadow-lg p-4 rounded-4" style="width: 400px;">
    
    <h3 class="text-center mb-4">Student Login</h3>

    <form action="login.php" method="POST">

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn btn-dark w-100 mb-2">Login</button>

    </form>

    <!-- Student Register -->
    <div class="text-center mt-3">
        <small>Don't have an account?</small><br>
        <a href="register.html" class="fw-bold text-decoration-none text-primary">
            Register Here
        </a>
    </div>

    <hr>

    <!-- Admin Login -->
    <div class="text-center">
        <small>Are you an Admin?</small><br>
        <a href="admin_login.html" class="fw-bold text-danger text-decoration-none">
            Admin Login
        </a>
    </div>

</div>

</body>
</html>
